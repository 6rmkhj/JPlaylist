name: Signature visual audit

on:
  push:
    branches: [feat/signature-taste-journey-20260910]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture signature views
        run: |
          mkdir -p visual-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/jplaylist-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { readFile } from 'node:fs/promises';

          const payload = JSON.parse(await readFile('data/songs.json', 'utf8'));
          const source = Array.isArray(payload.songs) ? payload.songs : [...(payload.latestSongs || []), ...(payload.popularSongs || [])];
          const unique = [...new Map(source.map((song) => [String(song.id), song])).values()];
          const favorites = unique.slice(0, 6).map((song, index) => ({ ...song, likedAt: new Date(Date.now() - index * 3600000).toISOString() }));
          const browser = await chromium.launch({ headless: true });

          for (const viewport of [{ name: 'mobile', width: 390, height: 844 }, { name: 'desktop', width: 1440, height: 900 }]) {
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            await context.addInitScript((items) => {
              localStorage.setItem('jplaylist-favorites-v2', JSON.stringify({ version: 3, items }));
              localStorage.setItem('jplaylist-listen-platform-v1', 'spotify');
              localStorage.removeItem('jplaylist-experience-v1');
            }, favorites);
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await page.locator('#personalized').waitFor({ state: 'visible' });
            await page.locator('#personalized').screenshot({ path: `visual-artifacts/signature-${viewport.name}.png` });
            await page.locator('.jp-daily-card').nth(1).locator('[data-jp-rabbit-start]').click();
            await page.locator('.jp-path-card').nth(4).waitFor({ state: 'visible' });
            await page.locator('#rabbitHole').screenshot({ path: `visual-artifacts/rabbit-${viewport.name}.png` });
            await context.close();
          }
          await browser.close();
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: signature-visuals
          path: visual-artifacts
          retention-days: 1
