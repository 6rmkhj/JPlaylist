name: Update songs and deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/songs.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run regression tests
        run: |
          node --check app.js
          node --check bootstrap.js
          node --check ui-design.js
          node --check scripts/fetch-songs.mjs
          node --test tests/*.test.mjs

      - name: Install browser regression runtime
        if: github.event_name != 'schedule'
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser UX regressions
        if: github.event_name != 'schedule'
        run: npx playwright test --config=playwright.config.mjs

      - name: Collect Japan music data
        run: node scripts/fetch-songs.mjs

      - name: Validate dataset
        run: node scripts/validate-data.mjs

      - name: Persist last-success snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/songs.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh songs [skip ci]"
            git push
          fi

      - name: Build static artifact
        run: |
          mkdir -p _site/data
          cp index.html styles.css icons.css typography.css fixes.css app.js core.mjs ui-design.js bootstrap.js favicon.svg og-card.svg _site/
          cp data/songs.json _site/data/songs.json
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
