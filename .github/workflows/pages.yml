name: Update songs and deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/songs.json'
      - 'data/songs-kpop.json'
      - 'data/songs-pop.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run regression tests
        run: |
          node --check app.js
          node --check bootstrap.js
          node --check ui-design.js
          node --check experience-core.mjs
          node --check scripts/fetch-songs.mjs
          node --check scripts/fetch-scene.mjs
          node --check scripts/validate-scene-data.mjs
          node --test tests/*.test.mjs

      - name: Install browser regression runtime
        if: github.event_name != 'schedule'
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser UX regressions
        if: github.event_name != 'schedule'
        run: npx playwright test --config=playwright.config.mjs

      - name: Collect J-Pop music data
        run: |
          for attempt in 1 2 3; do
            echo "J-Pop collection attempt ${attempt}/3"
            node scripts/fetch-songs.mjs
            status=$(node -p "require('./data/songs.json').status")
            if [ "$status" != "stale" ]; then
              echo "J-Pop collection completed with status=$status"
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "J-Pop upstream returned stale fallback; retrying after a short delay."
              sleep $((attempt * 3))
            fi
          done

      - name: Collect K-Pop and Pop music data
        run: |
          for scene in kpop pop; do
            file="data/songs-${scene}.json"
            for attempt in 1 2 3; do
              echo "${scene} collection attempt ${attempt}/3"
              node scripts/fetch-scene.mjs "$scene"
              status=$(node -p "require('./${file}').status")
              if [ "$status" != "stale" ]; then
                echo "${scene} collection completed with status=$status"
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "${scene} upstream returned stale fallback; retrying after a short delay."
                sleep $((attempt * 3))
              fi
            done
          done

      - name: Validate datasets
        run: |
          node scripts/validate-data.mjs
          node scripts/validate-scene-data.mjs

      - name: Persist last-success snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/songs.json data/songs-kpop.json data/songs-pop.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh music scenes [skip ci]"
            git push
          fi

      - name: Build static artifact
        run: |
          mkdir -p _site/data
          cp index.html styles.css icons.css typography.css fixes.css experience.css scene.css app.js core.mjs experience-core.mjs ui-design.js bootstrap.js favicon.svg og-card.svg _site/
          cp data/songs*.json _site/data/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
