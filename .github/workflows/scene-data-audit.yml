name: Scene data and visual audit

on:
  push:
    branches: [feat/scene-spaces-20260911]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect live K-Pop and Pop scenes
        run: |
          node scripts/fetch-scene.mjs kpop
          node scripts/fetch-scene.mjs pop
      - name: Validate scene data
        run: node scripts/validate-scene-data.mjs
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture all three theme spaces
        run: |
          mkdir -p visual-artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/jplaylist-scene-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import { writeFile } from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const audit = [];
          for (const scene of ['jpop', 'kpop', 'pop']) {
            for (const viewport of [
              { name: 'mobile', width: 390, height: 844 },
              { name: 'desktop', width: 1440, height: 900 },
            ]) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              const query = scene === 'jpop' ? '' : `?scene=${scene}`;
              await page.goto(`http://127.0.0.1:4173/${query}`, { waitUntil: 'networkidle' });
              await page.locator('#personalized').waitFor({ state: 'visible' });
              await page.locator('.song-card').first().waitFor({ state: 'visible' });
              const metrics = await page.evaluate(() => {
                const root = getComputedStyle(document.documentElement);
                const featured = getComputedStyle(document.querySelector('.featured-card'));
                return {
                  width: document.documentElement.clientWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  background: root.getPropertyValue('--bg').trim(),
                  accent: root.getPropertyValue('--accent').trim(),
                  selected: root.getPropertyValue('--selected').trim(),
                  featuredRadius: featured.borderTopLeftRadius,
                  switchRect: document.querySelector('.scene-switch')?.getBoundingClientRect().toJSON(),
                  dailyCount: document.querySelectorAll('.jp-daily-card').length,
                  cardCount: document.querySelectorAll('.song-card').length,
                };
              });
              if (metrics.scrollWidth > metrics.width + 1) throw new Error(`${scene}/${viewport.name}: horizontal overflow ${metrics.scrollWidth} > ${metrics.width}`);
              if (metrics.dailyCount !== 3) throw new Error(`${scene}/${viewport.name}: expected 3 daily cards`);
              audit.push({ scene, viewport: viewport.name, ...metrics });
              await page.screenshot({ path: `visual-artifacts/${scene}-${viewport.name}.png`, fullPage: true });
              await context.close();
            }
          }
          await browser.close();
          await writeFile('visual-artifacts/audit.json', JSON.stringify(audit, null, 2));
          NODE
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scene-space-audit
          path: |
            visual-artifacts
            data/songs-kpop.json
            data/songs-pop.json
          retention-days: 1
