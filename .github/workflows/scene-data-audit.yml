name: Scene data audit

on:
  push:
    branches: [feat/music-scenes-jkpop-20260911]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect live K-Pop and Pop scenes
        run: |
          node scripts/fetch-scene.mjs kpop
          node scripts/fetch-scene.mjs pop
      - name: Validate scene data
        run: node scripts/validate-scene-data.mjs
      - name: Upload collected scene payloads
        uses: actions/upload-artifact@v4
        with:
          name: scene-data-audit
          path: |
            data/songs-kpop.json
            data/songs-pop.json
          retention-days: 1
