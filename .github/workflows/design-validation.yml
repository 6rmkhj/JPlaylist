name: Design validation

on:
  push:
    branches: [fix/design-system-89-110]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static and regression tests
        run: |
          node --check app.js
          node --check ui-design.js
          node --test tests/*.test.mjs
      - name: Install CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f
      - name: Render responsive screenshots
        run: |
          python3 -m http.server 4173 > /tmp/jplaylist-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          mkdir -p design-shots
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=320,568 --screenshot=design-shots/320x568.png http://127.0.0.1:4173/
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=design-shots/390x844.png http://127.0.0.1:4173/
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=768,1024 --screenshot=design-shots/768x1024.png http://127.0.0.1:4173/
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1024,768 --screenshot=design-shots/1024x768.png http://127.0.0.1:4173/
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=design-shots/1440x900.png http://127.0.0.1:4173/
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=design-shots/390-discovery.png http://127.0.0.1:4173/%23discovery
          "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=design-shots/1440-discovery.png http://127.0.0.1:4173/%23discovery
      - uses: actions/upload-artifact@v4
        with:
          name: design-shots
          path: design-shots/
