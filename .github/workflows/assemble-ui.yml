name: Assemble UI bundle

on:
  push:
    branches: [fix/resolve-all-ui-ux-issues-20260910]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assemble and verify app bundle
        run: |
          cat .tmp2/app.js.gz.b64.* | tr -d '\n' | base64 -d | gzip -d > app.js
          test "$(git hash-object app.js)" = "b32904491a51b67d23fd19f679b23419bcb36f8b"
          node --check app.js
          node --check core.mjs
          node --test tests/*.test.mjs

      - name: Commit verified bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git rm -r .tmp .tmp2
          git commit -m "feat(ui): resolve all open UX issues [assembled]"
          git push
